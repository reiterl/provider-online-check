<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSAF Provider Scan — Access Denied</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 1rem;
            background-color: #f8f9fa;
            color: #212529;
        }
        nav {
            background-color: #212529;
            padding: 0.5rem 1rem;
        }
        .navbar-brand {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 500;
            text-decoration: none;
        }
        .container {
            max-width: 720px;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        .card {
            background: #fff;
            border: 1px solid rgba(0,0,0,.125);
            border-radius: 0.375rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,.15);
        }
        .card-body { padding: 1.5rem; }
        .alert {
            padding: 1rem 1.25rem;
            border-radius: 0.375rem;
            background-color: #f8d7da;
            border: 1px solid #f5c2c7;
            color: #842029;
        }
        .alert-heading {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
        }
        p { margin: 0; line-height: 1.6; }
    </style>
</head>
<body>
    <nav>
        <a class="navbar-brand" href="/">CSAF Provider Scan</a>
    </nav>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <div class="alert">
                    <h5 class="alert-heading">Access Denied</h5>
                    <p>Your request has been blocked by the service operator.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
